<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error · QuindioStay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body class="qs">
<div class="qs-login-fondo">
    <div class="bg-white rounded-4 shadow p-5" style="max-width: 560px">
        <h1 class="qs-titulo" th:text="${status == 403 ? 'No tienes permiso' : (status == 404 ? 'No encontrado' : 'Algo salió mal')}">Error</h1>
        <p class="text-muted" th:text="${message}">mensaje</p>
        <p class="small text-muted" th:text="${'Código ' + status}">Código</p>
        <a class="btn btn-qs px-4" th:href="@{/}">Volver al inicio</a>
    </div>
</div>
</body>
</html>
