<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Piezas que se repiten en todas las páginas -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · QuindioStay'">QuindioStay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>

<!-- Barra superior con el menú según el rol -->
<header th:fragment="menu(activo)" class="qs-top d-flex align-items-center gap-3 flex-wrap">
    <a class="qs-marca" th:href="@{/}">QuindioStay</a>
    <nav class="d-flex gap-1 flex-wrap">
        <a sec:authorize="hasAnyRole('ADMIN','OPERADOR')" th:href="@{/}" th:classappend="${activo == 'inicio'} ? 'activo'">Inicio</a>
        <a sec:authorize="hasAnyRole('ADMIN','OPERADOR')" th:href="@{/crud/cliente}" th:classappend="${activo == 'crud'} ? 'activo'">Registros</a>
        <a sec:authorize="hasAnyRole('ADMIN','OPERADOR')" th:href="@{/redimir}" th:classappend="${activo == 'redimir'} ? 'activo'">Redimir</a>
        <a sec:authorize="hasAnyRole('ADMIN','OPERADOR','ENCARGADO')" th:href="@{/reportes}" th:classappend="${activo == 'reportes'} ? 'activo'">Reportes</a>
        <a sec:authorize="hasAnyRole('ADMIN','OPERADOR')" th:href="@{/documentos}" th:classappend="${activo == 'documentos'} ? 'activo'">Documentos</a>
        <a sec:authorize="hasRole('ENCARGADO')" th:href="@{/encargado}" th:classappend="${activo == 'encargado'} ? 'activo'">Mi prestador</a>
        <a sec:authorize="hasRole('CLIENTE')" th:href="@{/mi-cuenta}" th:classappend="${activo == 'cuenta'} ? 'activo'">Mi cuenta</a>
    </nav>
    <div class="ms-auto d-flex align-items-center gap-2 me-5">
        <span class="small text-muted">
            <i class="bi bi-person-circle"></i>
            <span th:text="${#authentication.principal.nombreMostrar}">usuario</span>
            · <span th:text="${#authentication.principal.rol}">rol</span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-sm btn-qs-borde px-3">Salir</button>
        </form>
    </div>
</header>

<!-- Mensajes de éxito o error -->
<div th:fragment="mensajes">
    <div th:if="${ok}" class="alert alert-success py-2" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span></div>
</div>

<!-- Tabla genérica para cualquier lista de resultados -->
<div th:fragment="tabla(filas)" class="table-responsive">
    <p th:if="${#lists.isEmpty(filas)}" class="text-muted fst-italic">Sin datos.</p>
    <table th:unless="${#lists.isEmpty(filas)}" class="table table-sm table-hover qs-tabla">
        <thead>
        <tr><th th:each="k : ${filas[0].keySet()}" th:text="${#strings.replace(k, '_', ' ')}">columna</th></tr>
        </thead>
        <tbody>
        <tr th:each="f : ${filas}">
            <td th:each="k : ${f.keySet()}" th:text="${@fmt.v(f.get(k))}">valor</td>
        </tr>
        </tbody>
    </table>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</html>
